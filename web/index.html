<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#071f20" />
  <meta name="description" content="Swamp Attack — захисти хатину від болотних монстрів!" />
  <link rel="icon" type="image/png" href="./swamp-attack-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Swamp Attack</title>
</head>
<body>
  <main id="app">
    <section id="menu" class="screen menu-screen" aria-label="Головне меню">
      <div class="shade"></div>
      <button id="sound-toggle" class="round-button sound-button" aria-label="Звук">🔊</button>
      <div class="menu-content">
        <div class="logo" aria-label="Swamp Attack"><span>SWAMP</span><strong>ATTACK</strong></div>
        <p class="tagline">ЗАХИСТИ СВОЮ ХАТИНУ!</p>
        <div class="menu-actions">
          <button id="play-button" class="wood-button primary">▶ <span>ГРАТИ</span></button>
          <button id="upgrades-button" class="wood-button">🔧 <span>ПОКРАЩЕННЯ</span></button>
          <button id="how-button" class="wood-button small">? <span>ЯК ГРАТИ</span></button>
        </div>
        <div class="best-card">🏆 НАЙКРАЩА ХВИЛЯ <strong id="best-wave">0</strong></div>
      </div>
      <span class="version">v1.0 • offline</span>
    </section>

    <section id="game" class="screen game-screen" hidden aria-label="Гра">
      <canvas id="game-canvas"></canvas>
      <header class="hud">
        <div class="wave-pill"><small>ХВИЛЯ</small><strong id="wave-value">1</strong></div>
        <div class="health-wrap"><span>🏚️</span><div class="bar health"><i id="health-bar"></i></div></div>
        <div class="coin-pill">🪙 <strong id="coin-value">0</strong></div>
        <button id="pause-button" class="round-button" aria-label="Пауза">Ⅱ</button>
      </header>
      <div id="wave-banner" class="wave-banner">ХВИЛЯ 1</div>
      <div class="weapon-dock">
        <button class="weapon active" data-weapon="shotgun"><span>💥</span><small>ДРОБОВИК</small><b id="ammo-shotgun">8</b></button>
        <button class="weapon" data-weapon="rifle"><span>🔫</span><small>ГВИНТІВКА</small><b id="ammo-rifle">24</b></button>
        <button class="weapon" data-weapon="bomb"><span>💣</span><small>БОМБА</small><b id="ammo-bomb">3</b></button>
      </div>
      <p id="reload-hint" class="reload-hint" hidden>ПЕРЕЗАРЯДКА…</p>
    </section>

    <div id="modal" class="modal" hidden>
      <div class="modal-card">
        <button id="modal-close" class="modal-close" aria-label="Закрити">×</button>
        <div id="modal-content"></div>
      </div>
    </div>
    <div id="rotate-hint"><span>📱</span><strong>Поверни телефон</strong><small>Гра найкраще працює горизонтально</small></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
