name: Build LIBO APK

on:
  push:
    branches:
      - arena/b1dbeb1b-my-first-apk
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out LIBO
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub's Ubuntu images include the Android command-line tools and SDK.
      # Install only missing API-35 components instead of downloading a second SDK.
      - name: Prepare Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not configured on the runner." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found at $SDKMANAGER" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug-signed APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Name APK for download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/LIBO-v2.10.9.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIBO-v2.10.9.3-apk
          path: release-apk/LIBO-v2.10.9.3.apk
          if-no-files-found: error
          retention-days: 30
