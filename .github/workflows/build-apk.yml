name: Build LIBO Utility APK

on:
  push:
    paths:
      - 'libo-utility/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'libo-utility/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libo-utility
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show Gradle errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|Could not|error:|FAILURE|Exception" -A3 "$RUNNER_TEMP/build.log" | head -c 3500 > "$RUNNER_TEMP/errs.txt" || true
          tr '\n' '|' < "$RUNNER_TEMP/errs.txt" | sed 's/|/ ## /g' | while IFS= read -r line; do echo "::error title=GradleErrors::$line"; done
          echo "::error::$(tail -c 1500 "$RUNNER_TEMP/build.log" | tr '\n' '|')"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: libo-utility-debug-apk
          path: libo-utility/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
