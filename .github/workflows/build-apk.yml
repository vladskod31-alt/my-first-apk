name: Build LIBO APK

on:
  push:
    branches:
      - arena/b1dbeb1b-my-first-apk
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out LIBO
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub's Ubuntu images include the Android command-line tools and SDK.
      # Install only missing API-35 components instead of downloading a second SDK.
      - name: Prepare Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not configured on the runner." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found at $SDKMANAGER" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug-signed APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Surface Gradle failure details
        if: steps.gradle.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          lines = Path("gradle-build.log").read_text(errors="replace").splitlines()
          pattern = re.compile(
              r"(?:^e: |^w: |error:|FAILURE:|What went wrong:|"
              r"Execution failed for task|Unresolved reference|Compilation error|Caused by:)"
          )
          details = [line.strip() for line in lines if pattern.search(line)]
          if not details:
              details = lines[-25:]
          details = [line[:400] for line in details[-30:]]
          excerpt = "\n".join(details)
          escaped = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build failure::{escaped}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Gradle build failure\n\n```text\n")
              summary.write(excerpt + "\n```\n")
          PY

      - name: Upload Gradle failure log
        if: steps.gradle.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: LIBO-v2.10.9.3-build-log
          path: gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail workflow if Gradle failed
        if: steps.gradle.outcome == 'failure'
        run: exit 1

      - name: Name APK for download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/LIBO-v2.10.9.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIBO-v2.10.9.3-apk
          path: release-apk/LIBO-v2.10.9.3.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v2.10.9.3"
          apk="release-apk/LIBO-v2.10.9.3.apk"
          notes="$RUNNER_TEMP/libo-release-notes.md"
          cat > "$notes" <<'EOF'
          Native Kotlin and Jetpack Compose build of LIBO 2.10.9.3.

          This APK is debug-signed for direct installation and testing; it is not a Play Store production-signed package.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LIBO Android 2.10.9.3" --notes-file "$notes"
          fi
          checksum="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          echo "::notice title=APK SHA-256::$checksum"
          echo "### GitHub Release" >> "$GITHUB_STEP_SUMMARY"
          echo "Published [LIBO-v2.10.9.3.apk](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/LIBO-v2.10.9.3.apk)." >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $checksum" >> "$GITHUB_STEP_SUMMARY"

      # Keep a Git blob for retrieval through the allowed GitHub REST API.
      # It is not attached to a branch or commit; the release asset is canonical.
      - name: Make APK retrievable for delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$RUNNER_TEMP/libo-apk-blob.json"
          python3 - "$payload" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          apk = Path("release-apk/LIBO-v2.10.9.3.apk").read_bytes()
          payload = {"content": base64.b64encode(apk).decode("ascii"), "encoding": "base64"}
          Path(sys.argv[1]).write_text(json.dumps(payload), encoding="utf-8")
          PY
          if blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input "$payload" --jq '.sha')"; then
            echo "::notice title=APK Git blob SHA::$blob_sha"
            echo "APK delivery object: $blob_sha" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=APK delivery object::Could not make a temporary API copy of the APK. The GitHub Release asset is still published."
          fi
