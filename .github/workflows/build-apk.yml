name: Build LIBO Utility APK

on:
  push:
    paths:
      - 'libo-utility/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'libo-utility/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libo-utility
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Gradle error dump 1
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          grep -v -E "^\s+at |^\s*$" "$LOG" > "$RUNNER_TEMP/f.txt" || true
          N=$(wc -l < "$RUNNER_TEMP/f.txt")
          S=$((N-39)); [ $S -lt 1 ] && S=1
          sed -n "$((S+0)),$((S+9))p" "$RUNNER_TEMP/f.txt" | cut -c1-250 | while IFS= read -r line; do echo "::error title=dump1::$line"; done
          exit 0

      - name: Gradle error dump 2
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          grep -v -E "^\s+at |^\s*$" "$LOG" > "$RUNNER_TEMP/f.txt" || true
          N=$(wc -l < "$RUNNER_TEMP/f.txt")
          S=$((N-39)); [ $S -lt 1 ] && S=1
          sed -n "$((S+10)),$((S+19))p" "$RUNNER_TEMP/f.txt" | cut -c1-250 | while IFS= read -r line; do echo "::error title=dump2::$line"; done
          exit 0

      - name: Gradle error dump 3
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          grep -v -E "^\s+at |^\s*$" "$LOG" > "$RUNNER_TEMP/f.txt" || true
          N=$(wc -l < "$RUNNER_TEMP/f.txt")
          S=$((N-39)); [ $S -lt 1 ] && S=1
          sed -n "$((S+20)),$((S+29))p" "$RUNNER_TEMP/f.txt" | cut -c1-250 | while IFS= read -r line; do echo "::error title=dump3::$line"; done
          exit 0

      - name: Gradle error dump 4
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          grep -v -E "^\s+at |^\s*$" "$LOG" > "$RUNNER_TEMP/f.txt" || true
          N=$(wc -l < "$RUNNER_TEMP/f.txt")
          S=$((N-39)); [ $S -lt 1 ] && S=1
          sed -n "$((S+30)),$((S+39))p" "$RUNNER_TEMP/f.txt" | cut -c1-250 | while IFS= read -r line; do echo "::error title=dump4::$line"; done
          exit 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: libo-utility-debug-apk
          path: libo-utility/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
