name: Build LIBO APK

on:
  push:
    branches:
      - arena/b1dbeb1b-my-first-apk
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out LIBO
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android 35 platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug-signed APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Name APK for download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/LIBO-v2.10.9.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIBO-v2.10.9.3-apk
          path: release-apk/LIBO-v2.10.9.3.apk
          if-no-files-found: error
          retention-days: 30
