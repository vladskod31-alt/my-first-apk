name: Publish verified 2.8.9.1 assets
on:
  push:
    branches: ['arena/01a1013d-my-first-apk']
    paths: ['.github/workflows/publish-2891.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.8.9.1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify immutable release APK
        run: |
          set -euo pipefail
          (cd downloads && sha256sum -c SHA256SUMS.txt)
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose --print-certs downloads/LIBO-2.8.9.1.apk | tee /tmp/signature.txt
          grep -q '1e12bb359114d2a1f2d5d2e9e975fb69b20c3f6ce85377cef5c81880748f10b1' /tmp/signature.txt
          "$TOOLS/zipalign" -c 4 downloads/LIBO-2.8.9.1.apk
          "$TOOLS/aapt2" dump badging downloads/LIBO-2.8.9.1.apk | grep "name='app.libo.messenger' versionCode='2080901' versionName='2.8.9.1'"
          git diff --binary v2.8.8 v2.8.9.1 > LIBO-2.8.9.1.patch
      - name: Publish APK, patch, icon evidence and screenshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.8.9.1 --clobber \
            downloads/LIBO-2.8.9.1.apk downloads/SHA256SUMS.txt \
            downloads/SIGNING.txt downloads/APK-INFO.txt \
            downloads/ICON-VERIFICATION.json downloads/ICON-FROM-APK.png \
            art/orbit-2891-preview.png LIBO-2.8.9.1.patch
