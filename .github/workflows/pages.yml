name: Pages (web build)

# Publishes the Vite production build of LIBO as a static web app.
# Requires: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The P2P messenger keeps working without a backend: the signalling server is
# still https://0.peerjs.com (or your own TURN/PeerJS server in Settings).
on:
  # Manual only: a push-to-main trigger would fail until Pages is enabled in
  # Settings → Pages → Source: GitHub Actions. Enable Pages, then add:
  #   push:
  #     branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
