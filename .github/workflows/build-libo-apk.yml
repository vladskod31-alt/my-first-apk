name: Build LIBO APK

# Publishes a debug APK for every push to main (and on demand).
# The Gradle build needs the built web assets in dist/, which is not tracked,
# so Node has to run `npm ci && npm run build` before assembleDebug.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build web assets
        run: npm ci && npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug

      - name: Check the APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -5
          sha256sum "$APK"

      - name: Upload LIBO APK
        uses: actions/upload-artifact@v4
        with:
          name: LIBO-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
